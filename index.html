<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星期五Studio</title>
<link rel="manifest" href="manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #1a1a2e; color: #f0f0f8;
    min-height: 100vh; font-size: 18px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 520px; margin: 0 auto; padding: 12px 14px 40px; }
  .header { text-align: center; padding: 10px 0 6px; }
  .header-logo { font-size: 36px; }
  .header h1 {
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .steps {
    display: flex; align-items: center; justify-content: center;
    gap: 3px; margin: 8px 0 14px; flex-wrap: wrap;
  }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: #252540; border: 2px solid #3d3d66;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #8888aa;
    transition: all 0.3s;
  }
  .step-dot.active { background: #a78bfa; border-color: #a78bfa; color: white; }
  .step-dot.done { background: #34d399; border-color: #34d399; color: white; }
  .step-line { width: 24px; height: 2px; background: #3d3d66; border-radius: 1px; transition: background 0.3s; }
  .step-line.done { background: #34d399; }
  .step-title { font-size: 20px; font-weight: 700; text-align: center; margin: 4px 0 14px; color: #f0f0f8; }
  .step-subtitle { font-size: 15px; color: #8888aa; text-align: center; margin-bottom: 14px; }
  .main-card {
    background: #252540; border: 1px solid #3d3d66;
    border-radius: 16px; padding: 18px; margin-bottom: 12px;
    min-height: 120px;
  }
  .main-card .label {
    font-size: 17px; font-weight: 700; color: #b0b0d0;
    margin-bottom: 10px;
  }
  .step-content { display: none; }
  .step-content.visible { display: block; }
  .choice-grid { display: flex; flex-direction: column; gap: 8px; }
  .choice-btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 14px 16px;
    background: #2f2f50; border: 3px solid #3d3d66;
    border-radius: 14px; color: #f0f0f8;
    font-size: 18px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    text-align: left; font-family: inherit;
  }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn .emoji { font-size: 28px; flex-shrink: 0; }
  .choice-btn .desc { font-size: 13px; color: #8888aa; font-weight: 400; margin-top: 1px; }
  .choice-btn.selected { border-color: #a78bfa; background: rgba(167,139,250,0.12); }

  .text-display {
    background: #1a1a2e; border: 1px solid #3d3d66;
    border-radius: 12px; padding: 14px;
    font-size: 16px; line-height: 1.7;
    color: #d0d0e0; max-height: 400px; overflow-y: auto;
    white-space: pre-wrap;
  }
  .sb-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .sb-table th { background: #2f2f50; color: #b0b0d0; padding: 8px; text-align: left; font-weight: 600; border-bottom: 2px solid #3d3d66; }
  .sb-table td { padding: 8px; border-bottom: 1px solid #3d3d66; color: #d0d0e0; vertical-align: top; }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button {
    flex: 1; padding: 14px 8px; border-radius: 12px;
    border: none; font-size: 17px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent; font-family: inherit;
  }
  .actions button:active { transform: scale(0.96); }
  .btn-confirm { background: #7c3aed; color: white; }
  .btn-confirm2 { background: #a78bfa; color: white; }
  .btn-retry { background: #2f2f50; color: #b0b0d0; border: 2px solid #3d3d66 !important; }
  .btn-tweak { background: #2f2f50; color: #f0f0f8; border: 2px solid #3d3d66 !important; }

  .tweak-area { display: none; margin-top: 10px; }
  .tweak-area.visible { display: block; }
  .tweak-area textarea, .custom-input textarea {
    width: 100%; background: #2f2f50; border: 2px solid #a78bfa;
    border-radius: 10px; color: #f0f0f8; font-size: 17px;
    padding: 12px; min-height: 80px; font-family: inherit;
    line-height: 1.5; outline: none;
  }
  .tweak-area button, .custom-input button {
    width: 100%; padding: 14px; margin-top: 8px;
    background: #a78bfa; border: none; border-radius: 10px;
    color: white; font-size: 17px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .tweak-area button:active, .custom-input button:active { opacity: 0.8; }

  .custom-input { display: none; }
  .custom-input.visible { display: block; }

  .idea-input {
    width: 100%; background: #2f2f50; border: 2px solid #3d3d66;
    border-radius: 12px; color: #f0f0f8; font-size: 20px;
    padding: 16px; min-height: 120px; font-family: inherit;
    line-height: 1.6; outline: none;
  }
  .idea-input:focus { border-color: #a78bfa; }
  .idea-input::placeholder { color: #6a6a8a; font-size: 18px; }

  .voice-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px; margin-top: 8px;
    background: #2f2f50; border: 2px dashed #3d3d66;
    border-radius: 10px; color: #b0b0d0; font-size: 17px; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    font-family: inherit; transition: all 0.2s;
  }
  .voice-btn:active { background: #3d3d66; }
  .voice-btn.listening {
    border-color: #a78bfa; background: rgba(167,139,250,0.15);
    color: #a78bfa; animation: pulse 1.2s infinite;
  }

  .media-placeholder {
    width: 100%; min-height: 220px;
    background: #1a1a2e; border: 2px dashed #3d3d66;
    border-radius: 12px; display: flex;
    align-items: center; justify-content: center;
    font-size: 40px; color: #5a5a7a;
    margin-bottom: 10px;
  }
  .media-placeholder img, .media-placeholder video {
    width: 100%; display: block; border-radius: 10px;
  }

  .final-badge {
    background: #34d399; color: white;
    text-align: center; padding: 14px;
    font-size: 20px; font-weight: 800; border-radius: 12px;
    margin-bottom: 12px;
  }

  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #252540; border: 1px solid #3d3d66;
    border-radius: 14px; padding: 14px 24px;
    font-size: 17px; color: #f0f0f8;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    opacity: 0; transition: all 0.3s;
    pointer-events: none; z-index: 100;
    white-space: nowrap; max-width: 90vw; font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .fade-in { animation: fadeIn 0.35s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100%{border-color:#a78bfa} 50%{border-color:#c084fc} }
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="max-width:400px;width:100%;text-align:center">
    <div style="font-size:56px;margin-bottom:12px">🎬</div>
    <h1 style="font-size:24px;font-weight:800;color:#a78bfa;margin-bottom:6px">星期五 Studio</h1>
    <p style="font-size:15px;color:#8888aa;margin-bottom:24px">请输入密码以继续</p>
    <input type="password" id="pwd-input" placeholder="输入密码" style="width:100%;padding:16px;background:#2f2f50;border:2px solid #3d3d66;border-radius:12px;color:#f0f0f8;font-size:18px;text-align:center;outline:none;font-family:inherit" autocomplete="off">
    <button onclick="checkPassword()" style="width:100%;padding:16px;margin-top:12px;background:linear-gradient(135deg,#7c3aed,#a78bfa);border:none;border-radius:12px;color:white;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit">确定</button>
    <p id="pwd-error" style="color:#ef4444;font-size:14px;margin-top:10px;display:none">密码错误，请重试</p>
  </div>
</div>

<script>
const PWD_HASH = "6763d4a4d60481bcc4c29bc55566c83799d8dd65fb1510848a66dff2103a8360";
function checkPassword() {
  const input = document.getElementById("pwd-input").value;
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(input)).then(function(h) {
    const hash = Array.from(new Uint8Array(h)).map(function(b) { return b.toString(16).padStart(2,"0"); }).join("");
    if (hash === PWD_HASH) {
      localStorage.setItem("fs_logged_in", "1");
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("app").style.display = "";
      if (typeof goToStep === "function") goToStep("style-layer-1");
    } else {
      document.getElementById("pwd-error").style.display = "";
    }
  });
}
(function() {
  if (localStorage.getItem("fs_logged_in") === "1") {
    document.getElementById("login-screen").style.display = "none";
  } else {
    document.getElementById("app").style.display = "none";
  }
})();
</script>

<div class="container" id="app">
  <div class="header"><span class="header-logo">🎬</span><h1>星期五 Studio</h1></div>
  <div class="steps" id="step-dots"></div>
  <div class="step-title" id="step-title"></div>
  <div class="step-subtitle" id="step-subtitle"></div>
  <div id="steps-container"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ======================================================================
// WORKFLOW
// ======================================================================
const STEPS = [
  {
    id: 'style-layer-1',
    title: '🎨 选风格（1/5）',
    subtitle: '先定个大方向，后面还能调',
    render: function() {
      return renderChoices([
        { e:'🎥', n:'写实电影', d:'跟真实拍的一样，电影质感' },
        { e:'🔥', n:'动漫热血', d:'像日本动漫那种感觉' },
        { e:'🌸', n:'温馨插画', d:'柔和温暖，看着舒服' },
        { e:'🎋', n:'水墨国风', d:'中国水墨画的感觉' },
        { e:'🚀', n:'科幻未来', d:'高科技、霓虹灯、未来感' },
        { e:'🌑', n:'大气震撼', d:'壮观大场面，有气势' }
      ], 'style-layer-2', 'style');
    }
  },
  {
    id: 'style-layer-2',
    title: '🎨 选风格（2/5）',
    subtitle: '画面里的人物看起来应该怎样？',
    render: function() {
      return renderChoices([
        { e:'🧑', n:'写实比例', d:'跟真人一样的身材比例' },
        { e:'🎭', n:'夸张动漫', d:'大眼睛小嘴巴，动漫风' },
        { e:'⬛', n:'剪影为主', d:'看不清脸，靠轮廓和光影' },
        { e:'🎨', n:'半抽象', d:'不太写实，偏艺术感' }
      ], 'style-layer-3', 'charStyle');
    }
  },
  {
    id: 'style-layer-3',
    title: '🎨 选风格（3/5）',
    subtitle: '整个画面的气氛想怎么样的？',
    render: function() {
      return renderChoices([
        { e:'🌧️', n:'压抑阴冷', d:'阴沉、安静、有点压抑' },
        { e:'👻', n:'诡异不安', d:'让人心里发毛的感觉' },
        { e:'🏛️', n:'史诗宏大', d:'壮观辽阔，气势磅礴' },
        { e:'🌿', n:'写实自然', d:'跟现实中的自然光一样' }
      ], 'style-layer-4', 'atmosphere');
    }
  },
  {
    id: 'style-layer-4',
    title: '🎨 选风格（4/5）',
    subtitle: '镜头怎么动？',
    render: function() {
      return renderChoices([
        { e:'📖', n:'标准叙事', d:'正常拍摄，稳当不出错' },
        { e:'🎬', n:'电影感运镜', d:'跟大片一样镜头慢慢移动' },
        { e:'📱', n:'手持晃镜', d:'像有人拿着拍，有现场感' },
        { e:'🎯', n:'固定机位', d:'镜头不动，画面很稳' }
      ], 'style-layer-5', 'camera');
    }
  },
  {
    id: 'style-layer-5',
    title: '🎨 选风格（5/5）',
    subtitle: '背景声音想要什么样的？',
    render: function() {
      return renderChoices([
        { e:'🎙️', n:'低沉旁白', d:'有人慢慢解说' },
        { e:'🌊', n:'环境音为主', d:'风声雨声环境声' },
        { e:'🎵', n:'强配乐', d:'背景音乐特别突出' },
        { e:'🎶', n:'混合模式', d:'旁白+配乐+环境音' }
      ], 'step-1', 'audio');
    }
  },
  {
    id: 'step-1',
    title: '✏️ 写脚本',
    subtitle: '告诉 AI 你的想法，它帮你写成剧本',
    render: function() {
      if (!workflowState.userIdea) {
        return `
          <div class="main-card fade-in">
            <div class="label">📝 你想做什么视频？</div>
            <textarea class="idea-input" id="idea-input" placeholder="比如：一只猫在太空站里飘来飘去，窗外能看到地球和星星..."></textarea>
            <button class="voice-btn" id="voice-btn-1" onclick="toggleVoice('idea-input','voice-btn-1')">🎤 用说的（按着说话）</button>
            <div class="actions" style="margin-top:12px">
              <button class="btn-retry" onclick="skipToStoryboard()" style="flex:1">➡️ 直接用我的想法</button>
              <button class="btn-confirm" onclick="submitIdea()" style="flex:1">✍️ 让 AI 写剧本</button>
            </div>
          </div>`;
      }
      return `
        <div class="main-card fade-in">
          <div class="label">📄 AI 写的剧本</div>
          <div class="text-display">${workflowState.generatedScript || generateMockScript()}</div>
          <div class="actions">
            <button class="btn-confirm" onclick="goToStep('step-2')">✅ 满意</button>
            <button class="btn-retry" onclick="regenerateScript()">🔄 换一个</button>
            <button class="btn-tweak" onclick="showTweak('step-1')">✏️ 改一下</button>
          </div>
          <div class="tweak-area" id="tweak-step-1">
            <textarea placeholder="想改成什么样？比如：把猫换成狗，场景改成月球..."></textarea>
            <button onclick="tweakScript()">✏️ 改好了，重新生成</button>
          </div>
        </div>`;
    }
  },
  {
    id: 'step-2',
    title: '🎬 分镜表',
    subtitle: 'AI 把剧本拆成一个个镜头',
    render: function() {
      const scenes = workflowState.storyboard || [];
      // Auto-generate storyboard from script if not yet generated
      if (!workflowState.storyboard && workflowState.generatedScript && !workflowState._storyboardLoading) {
        workflowState._storyboardLoading = true;
        setTimeout(function() { generateStoryboard(); }, 500);
      }
      if (!workflowState.storyboard) {
        return `<div class="main-card fade-in">
          <div class="label">📋 AI正在拆解分镜...</div>
          <div style="text-align:center;padding:30px"><div class="spinner"></div><div style="margin-top:10px;color:#8888aa">AI正在根据剧本生成分镜...</div></div>
        </div>`;
      }
      return `
        <div class="main-card fade-in">
          <div class="label">📋 镜头列表（共 ${scenes.length} 场）</div>
          <div style="overflow-x:auto">
          <table class="sb-table">
            <tr><th>场次</th><th>内容</th><th>角度/运镜</th><th>时长</th></tr>
            ${scenes.map(s => `<tr><td>${s.scene_num || s.scene || ''}</td><td>${(s.location || '') + ' ' + (s.action || '')}</td><td>${(s.camera_angle || s.shot || '') + ' ' + (s.camera_motion || '')}</td><td>${s.duration || '~2s'}</td></tr>`).join('')}
          </table>
          </div>
          ${workflowState.step2Tweak ? `<div style="background:#2f2f50;border:1px solid #a78bfa;border-radius:10px;padding:10px 12px;margin:4px 0 0;font-size:14px;color:#b0b0d0">✏️ 已采纳修改：${workflowState.step2Tweak}</div>` : ''}
          <div class="actions">
            <button class="btn-confirm" onclick="goToStep('step-3')">✅ 满意，下一步</button>
            <button class="btn-retry" onclick="regenerateStoryboard()">🔄 换一个</button>
            <button class="btn-tweak" onclick="showTweak('step-2')">✏️ 改一下</button>
          </div>
          <div class="tweak-area" id="tweak-step-2">
            <textarea placeholder="想怎么改？比如：第三场加个特写镜头..."></textarea>
            <button onclick="applyStep2Tweak()">✏️ 改好了</button>
          </div>
        </div>`;
    }
  },
  {
    id: 'step-2-5',
    title: '🎯 逐场精调',
    subtitle: '每场镜头，选个你喜欢的拍法',
    render: function() {
      const scenes = generateMockScenes();
      const current = workflowState.sceneIndex || 0;
      if (current >= scenes.length) {
        workflowState.sceneIndex = 0;
        return '<div class="main-card fade-in"><div class="label">✅ 所有镜头已确认</div><div class="actions"><button class="btn-confirm" onclick="goToStep(\'step-3\')">继续下一步 →</button></div></div>';
      }
      const s = scenes[current];
      const remaining = scenes.length - current - 1;
      return `
        <div class="main-card fade-in">
          <div class="label">🎬 第 ${current+1}/${scenes.length} 场：${s.content}</div>
          <div style="font-size:14px;color:#8888aa;margin-bottom:10px">还剩 ${remaining} 场没选</div>
          <div class="choice-grid" id="scene-choices">
            <div class="choice-btn" onclick="pickScenePreset('氛围优先')">
              <span class="emoji">🎥</span>
              <div><div>氛围优先</div><div class="desc">全景慢慢推，突出空旷感</div></div>
            </div>
            <div class="choice-btn" onclick="pickScenePreset('人物优先')">
              <span class="emoji">🎯</span>
              <div><div>人物优先</div><div class="desc">近景特写，看表情细节</div></div>
            </div>
            <div class="choice-btn" onclick="pickScenePreset('动静对比')">
              <span class="emoji">⚡</span>
              <div><div>动静对比</div><div class="desc">镜头不动，只有画面里有东西在动</div></div>
            </div>
            <div class="choice-btn" onclick="showCustomSceneInput()">
              <span class="emoji">🎬</span>
              <div><div>自定义</div><div class="desc">自己说说想要什么效果</div></div>
            </div>
          </div>
          <div class="custom-input" id="custom-scene-input">
            <div class="label" style="font-size:15px;color:#b0b0d0;margin:12px 0 6px">✏️ 说说你想要的效果：</div>
            <textarea id="custom-scene-text" placeholder="比如：镜头从下往上拍，慢动作，背景虚化..."></textarea>
            <button class="voice-btn" id="voice-btn-cs" onclick="toggleVoice('custom-scene-text','voice-btn-cs')">🎤 用说的（按着说话）</button>
            <button onclick="submitCustomScene()" style="margin-top:10px">✏️ 就用这个效果</button>
            <button onclick="hideCustomSceneInput()" style="background:#2f2f50;border:2px solid #3d3d66;color:#b0b0d0;margin-top:6px">← 返回选择</button>
          </div>
        </div>`;
    }
  },
  {
    id: 'step-3',
    title: '👤 角色三视图',
    subtitle: 'AI 生成角色正面/侧面/背面',
    render: function() {
      const charViews = workflowState.charViews;
      return `
        <div class="main-card fade-in">
          <div class="label">🎭 角色三视图</div>
          ${charViews ? `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
              ${charViews.map(function(v) {
                if (v.url) {
                  return '<div style="text-align:center"><div style="font-size:11px;color:#8888aa;margin-bottom:4px">' + v.name + '</div>' + (v.url ? '<img src="' + v.url + '" alt="' + v.name + '" style="width:100%;border-radius:8px">' : '<div style="background:#1e1e3a;border-radius:8px;padding:20px;font-size:12px;color:#666">' + v.name + '<br>生成失败</div>') + '</div>'
